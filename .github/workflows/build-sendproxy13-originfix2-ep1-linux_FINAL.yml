name: Build SendProxy 1.3 AWH OriginFix2 CSS34 EP1 Linux x86

on:
  push:
    paths:
      - '.github/workflows/build-sendproxy13-originfix2-ep1-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 file binutils

      - name: Fetch exact dependencies
        run: |
          mkdir -p deps
          git clone https://github.com/TheByKotik/sendproxy.git deps/sendproxy
          git -C deps/sendproxy checkout ebf42e67a3e75b413783ab3436d3d1e20635a8f9

          git clone https://github.com/alliedmodders/sourcemod.git deps/sourcemod
          git -C deps/sourcemod checkout 832519ab647cdecb85763918dbfed1cb5e79c6cb
          git -C deps/sourcemod submodule update --init --recursive

          git clone https://github.com/alliedmodders/metamod-source.git deps/metamod-source
          git -C deps/metamod-source checkout 9fed12f652af6a1b03d285d13abbd55726099d1e
          git -C deps/metamod-source submodule update --init --recursive

          mkdir -p deps/hl2sdk
          git clone --branch episode1 --single-branch https://github.com/alliedmodders/hl2sdk.git deps/hl2sdk/hl2sdk-episode1

          git clone https://github.com/alliedmodders/ambuild.git deps/ambuild
          python -m pip install --upgrade pip
          python -m pip install ./deps/ambuild

      - name: Apply CSS34 m_vecOrigin fix
        run: |
          cat > patch_sendproxy.py <<'PY'
          from pathlib import Path
          import re

          p = Path("deps/sendproxy/extension/extension.cpp")
          s = p.read_text(encoding="utf-8")

          if '#include "tier0/threadtools.h"' not in s:
              s = s.replace('#include "extension.h"',
                            '#include "extension.h"\n#include "tier0/threadtools.h"', 1)

          if not re.search(r'(?m)^\s*ICvar\s*\*\s*g_pCVar\s*=', s):
              needle = 'IServerGameClients * gameclients = nullptr;'
              if needle not in s:
                  raise SystemExit("gameclients global not found")
              s = s.replace(needle, needle + '\nICvar * g_pCVar = nullptr;', 1)

          parallel = re.compile(
              r'\s*GET_CONVAR\(sv_parallel_packentities\);\s*'
              r'sv_parallel_packentities->SetValue\(0\);[^\r\n]*\r?\n\s*'
              r'GET_CONVAR\(sv_parallel_sendsnapshot\);\s*'
              r'sv_parallel_sendsnapshot->SetValue\(0\);[^\r\n]*',
              re.M | re.S)
          if not parallel.search(s):
              raise SystemExit("parallel cvar block not found")
          s = parallel.sub(
              '\n#if SOURCE_ENGINE != SE_EPISODEONE\n'
              '\tGET_CONVAR(sv_parallel_packentities);\n'
              '\tsv_parallel_packentities->SetValue(0);\n'
              '\tGET_CONVAR(sv_parallel_sendsnapshot);\n'
              '\tsv_parallel_sendsnapshot->SetValue(0);\n'
              '#endif',
              s, count=1)

          decl = ('DECL_DETOUR(CGameServer_SendClientMessages);\n'
                  'DECL_DETOUR(CGameClient_ShouldSendMessages);\n'
                  'DECL_DETOUR(SV_ComputeClientPacks);')
          if decl not in s:
              raise SystemExit("detour declaration block not found")
          s = s.replace(decl, decl + '\nDECL_DETOUR(SendProxy_Origin_AWH);', 1)

          static_decl = ('static CBaseEntity * FindEntityByServerClassname(int, const char *);\n'
                         'static void CallChangeCallbacks(PropChangeHook * pInfo, void * pOldValue, void * pNewValue);\n'
                         'static void CallChangeGamerulesCallbacks(PropChangeHookGamerules * pInfo, void * pOldValue, void * pNewValue);')
          if static_decl not in s:
              raise SystemExit("static declaration block not found")
          s = s.replace(
              static_decl,
              static_decl + '\n'
              'bool CallVector(SendPropHook hook, Vector &vec);\n'
              'bool g_bAWHCallingOriginalOrigin = false;',
              1)

          origin_detour = r'''
          DETOUR_DECL_STATIC6(SendProxy_Origin_AWH, void,
              const SendProp *, pProp,
              const void *, pStructBase,
              const void *, pData,
              DVariant *, pOut,
              int, iElement,
              int, objectID)
          {
              /* First compute Valve's normal origin. Episode One's
               * SendProxy_Origin ignores pData and reads GetLocalOrigin(). */
              DETOUR_STATIC_CALL(SendProxy_Origin_AWH)(
                  pProp, pStructBase, pData, pOut, iElement, objectID);

              if (g_bAWHCallingOriginalOrigin)
                  return;

              if (!g_bCurrentGameClientCallFwd || g_iCurrentClientIndexInLoop < 0)
                  return;

              /* CSS34 OriginFix2:
               * Do not require g_Hooks[i].pVar == pProp here. The engine may
               * invoke a precomputed/flattened SendProp while the hook manager
               * stores the original SendProp pointer. We already know this is
               * SendProxy_Origin, so objectID + hook name is sufficient. */
              for (int i = 0; i < g_Hooks.Count(); i++)
              {
                  if (g_Hooks[i].objectID != objectID)
                      continue;
                  if (g_Hooks[i].PropType != PropType::Prop_Vector)
                      continue;
                  if (!g_Hooks[i].pVar)
                      continue;
                  if (strcmp(g_Hooks[i].pVar->GetName(), "m_vecOrigin") != 0)
                      continue;

                  Vector result(
                      pOut->m_Vector[0],
                      pOut->m_Vector[1],
                      pOut->m_Vector[2]);

                  if (CallVector(g_Hooks[i], result))
                  {
                      pOut->m_Vector[0] = result.x;
                      pOut->m_Vector[1] = result.y;
                      pOut->m_Vector[2] = result.z;
                  }
                  return;
              }
          }

          '''
          marker = '//detours'
          if marker not in s:
              raise SystemExit("detours marker not found")
          s = s.replace(marker, origin_detour + marker, 1)

          old_guard = '''bool CallVector(SendPropHook hook, Vector &vec)
          {
          \tif (!g_bSVComputePacksDone)
          \t\treturn false;'''
          new_guard = '''bool CallVector(SendPropHook hook, Vector &vec)
          {
          \tif (!g_bSVComputePacksDone)
          \t{
          \t\tif (!g_bCurrentGameClientCallFwd || g_iCurrentClientIndexInLoop < 0)
          \t\t\treturn false;
          \t}'''
          if old_guard not in s:
              raise SystemExit("CallVector guard not found")
          s = s.replace(old_guard, new_guard, 1)

          old_vec = '''\t\t\t\tcase PropType::Prop_Vector:
          \t\t\t\t{
          \t\t\t\t\tVector result = *(Vector *)pData;

          \t\t\t\t\tif (CallVector(g_Hooks[i], result))
          \t\t\t\t\t{
          \t\t\t\t\t\tg_Hooks[i].pRealProxy(pProp, pStructBase, &result, pOut, iElement, objectID);
          \t\t\t\t\t\treturn; // If somebody already handled this call, do not call other hooks for this entity & prop
          \t\t\t\t\t}
          \t\t\t\t\telse
          \t\t\t\t\t{
          \t\t\t\t\t\tg_Hooks[i].pRealProxy(pProp, pStructBase, pData, pOut, iElement, objectID);
          \t\t\t\t\t}
          \t\t\t\t\tbHandled = true;
          \t\t\t\t\tcontinue;
          \t\t\t\t}'''
          new_vec = '''\t\t\t\tcase PropType::Prop_Vector:
          \t\t\t\t{
          \t\t\t\t\tVector result = *(Vector *)pData;
          \t\t\t\t\tbool isOrigin = (strcmp(pProp->GetName(), "m_vecOrigin") == 0);

          \t\t\t\t\tif (CallVector(g_Hooks[i], result))
          \t\t\t\t\t{
          \t\t\t\t\t\tif (isOrigin)
          \t\t\t\t\t\t{
          \t\t\t\t\t\t\tpOut->m_Vector[0] = result.x;
          \t\t\t\t\t\t\tpOut->m_Vector[1] = result.y;
          \t\t\t\t\t\t\tpOut->m_Vector[2] = result.z;
          \t\t\t\t\t\t\treturn;
          \t\t\t\t\t\t}

          \t\t\t\t\t\tg_Hooks[i].pRealProxy(pProp, pStructBase, &result, pOut, iElement, objectID);
          \t\t\t\t\t\treturn;
          \t\t\t\t\t}
          \t\t\t\t\telse
          \t\t\t\t\t{
          \t\t\t\t\t\tif (isOrigin)
          \t\t\t\t\t\t\tg_bAWHCallingOriginalOrigin = true;

          \t\t\t\t\t\tg_Hooks[i].pRealProxy(pProp, pStructBase, pData, pOut, iElement, objectID);

          \t\t\t\t\t\tif (isOrigin)
          \t\t\t\t\t\t\tg_bAWHCallingOriginalOrigin = false;
          \t\t\t\t\t}

          \t\t\t\t\tbHandled = true;
          \t\t\t\t\tcontinue;
          \t\t\t\t}'''
          if old_vec not in s:
              raise SystemExit("GlobalProxy vector block not found")
          s = s.replace(old_vec, new_vec, 1)

          create = ('\tCREATE_DETOUR(CGameServer_SendClientMessages, "CGameServer::SendClientMessages", bDetoursInited);\n'
                    '\tCREATE_DETOUR(CGameClient_ShouldSendMessages, "CGameClient::ShouldSendMessages", bDetoursInited);\n'
                    '\tCREATE_DETOUR_STATIC(SV_ComputeClientPacks, "SV_ComputeClientPacks", bDetoursInited);')
          if create not in s:
              raise SystemExit("detour creation block not found")
          s = s.replace(
              create,
              create + '\n'
              '\tbool bOriginDetourInited = false;\n'
              '\tCREATE_DETOUR_STATIC(SendProxy_Origin_AWH, "SendProxy_Origin", bOriginDetourInited);',
              1)

          check = '''\tif (!bDetoursInited)
          \t{
          \t\tsnprintf(error, maxlength, "Could not create detours, see error log!");
          \t\treturn false;
          \t}'''
          new_check = '''\tif (!bDetoursInited || !bOriginDetourInited)
          \t{
          \t\tsnprintf(error, maxlength, "Could not create required CSS34 detours, see error log!");
          \t\treturn false;
          \t}'''
          if check not in s:
              raise SystemExit("detour validation block not found")
          s = s.replace(check, new_check, 1)

          destroy = '''\tDESTROY_DETOUR(CGameServer_SendClientMessages);
          \tDESTROY_DETOUR(CGameClient_ShouldSendMessages);
          \tDESTROY_DETOUR(SV_ComputeClientPacks);'''
          if destroy not in s:
              raise SystemExit("detour destruction block not found")
          s = s.replace(destroy, destroy + '\n\tDESTROY_DETOUR(SendProxy_Origin_AWH);', 1)

          p.write_text(s, encoding="utf-8", newline="\n")

          cfg = Path("deps/sendproxy/extension/smsdk_config.h")
          t = cfg.read_text(encoding="utf-8")
          t = t.replace('#define SMEXT_CONF_VERSION\t\t\t"1.3.3"',
                        '#define SMEXT_CONF_VERSION\t\t\t"1.3.3-css34-originfix2"')
          cfg.write_text(t, encoding="utf-8", newline="\n")
          PY
          python patch_sendproxy.py

          cat > deps/sendproxy/addons/sourcemod/gamedata/sendproxy.txt <<'GD'
          "Games"
          {
              "cstrike"
              {
                  "Signatures"
                  {
                      "CGameClient::ShouldSendMessages"
                      {
                          "library"   "engine"
                          "windows"   "\x83\xEC\x08\x56\x8B\xF1\x80\xBE\xAC\x00\x00\x00\x00\x74\x5A"
                          "linux"     "@_ZN11CGameClient18ShouldSendMessagesEv"
                      }

                      "CGameServer::SendClientMessages"
                      {
                          "library"   "engine"
                          "windows"   "\x6A\xFF\x68\x2A\x2A\x2A\x2A\x64\xA1\x00\x00\x00\x00\x50\x64\x89\x25\x00\x00\x00\x00\x81\xEC\x00\x04\x00\x00\x53\x55\x57\x6A\x04\x33\xDB"
                          "linux"     "@_ZN11CGameServer18SendClientMessagesEb"
                      }

                      "SV_ComputeClientPacks"
                      {
                          "library"   "engine"
                          "windows"   "\x6A\xFF\x68\x2A\x2A\x2A\x2A\x64\xA1\x00\x00\x00\x00\x50\x64\x89\x25\x00\x00\x00\x00\x83\xEC\x0C\x53\x55\x56\x57\x8B\x3D\x2A\x2A\x2A\x2A\x89\x7C\x24\x18\x8B\x07\x8B\xCF\xFF\x50\x60\x33\xF6\x89\x74\x24\x24"
                          "linux"     "@_Z21SV_ComputeClientPacksiPP11CGameClientP14CFrameSnapshot"
                      }

                      "SendProxy_Origin"
                      {
                          "library"   "server"
                          "windows"   "\x80\x3D\x2A\x2A\x2A\x2A\x00\x53\x56\x8B\x74\x24\x10\x8D\x9E\x1C\x03\x00\x00\x74\x39\x85\xF6\x74\x35\x80\xBE\xDE\x00\x00\x00\x03\x75\x2C"
                          "linux"     "@_Z16SendProxy_OriginPK8SendPropPKvS3_P8DVariantii"
                      }
                  }
              }
          }
          GD

          echo "OriginFix markers:"
          grep -nE 'SendProxy_Origin_AWH|g_bAWHCallingOriginalOrigin|isOrigin' deps/sendproxy/extension/extension.cpp
          cat deps/sendproxy/addons/sourcemod/gamedata/sendproxy.txt

      - name: Configure and build Episode One target
        run: |
          mkdir -p deps/sendproxy/extension/build
          cd deps/sendproxy/extension/build
          python ../configure.py \
            -s episode1 \
            --hl2sdk-root="$GITHUB_WORKSPACE/deps/hl2sdk" \
            --mms-path="$GITHUB_WORKSPACE/deps/metamod-source" \
            --sm-path="$GITHUB_WORKSPACE/deps/sourcemod" \
            --enable-optimize
          ambuild

      - name: Package SO and gamedata
        run: |
          so="$(find deps/sendproxy/extension/build -type f -name 'sendproxy.ext.1.ep1.so' | head -n1)"
          test -n "$so" || { echo "sendproxy.ext.1.ep1.so was not produced"; exit 1; }

          mkdir -p artifact/addons/sourcemod/extensions artifact/addons/sourcemod/gamedata
          cp "$so" artifact/addons/sourcemod/extensions/sendproxy.ext.1.ep1.so
          cp deps/sendproxy/addons/sourcemod/gamedata/sendproxy.txt artifact/addons/sourcemod/gamedata/sendproxy.txt

          sha256sum artifact/addons/sourcemod/extensions/sendproxy.ext.1.ep1.so
          file artifact/addons/sourcemod/extensions/sendproxy.ext.1.ep1.so
          readelf -h artifact/addons/sourcemod/extensions/sendproxy.ext.1.ep1.so

          file artifact/addons/sourcemod/extensions/sendproxy.ext.1.ep1.so | grep -q 'ELF 32-bit'
          readelf -h artifact/addons/sourcemod/extensions/sendproxy.ext.1.ep1.so | grep -q 'Intel 80386'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sendproxy13-css34-originfix2-linux32
          path: artifact/
          if-no-files-found: error
